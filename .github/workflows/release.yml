name: Release

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Compute next version
        id: version
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          current=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          read -r bump next < <(bash .github/scripts/next_version.sh "$BRANCH" "${current:-v0.0.0}")
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Branch '$BRANCH' -> bump=$bump, ${current:-v0.0.0} -> $next"

      - name: Tag and publish release
        if: steps.version.outputs.bump != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          gh release create "$NEXT" --target "$SHA" --title "$NEXT — $PR_TITLE" --generate-notes
